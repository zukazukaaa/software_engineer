# Isolated services for the integration test suite.
# Different ports (5433 / 6380) so a developer can run unit tests, dev
# services, and integration tests in parallel without collisions.
# Volumes are intentionally NOT named — `down -v` wipes them every run
# so each integration test session starts from a clean schema.

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: omega-postgres-test
    environment:
      POSTGRES_USER: omega
      POSTGRES_PASSWORD: omega_test
      POSTGRES_DB: omega_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omega -d omega_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis-test:
    image: redis:7-alpine
    container_name: omega-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
