services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omega-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omega
      POSTGRES_PASSWORD: omega
      POSTGRES_DB: omega_emergence
    ports:
      - "5432:5432"
    volumes:
      - omega-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omega -d omega_emergence"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: omega-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - omega-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  omega-postgres-data:
  omega-redis-data:
